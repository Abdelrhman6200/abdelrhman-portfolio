# Runs every package's type check, tests and build on every push and PR.
#
# The portfolio's central claim is that its numbers are checkable — this is
# where they get checked, in public, on every change.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # One check across every package, so it is a job rather than a matrix entry.
  # Plain node with no dependencies — nothing to install.
  readability:
    runs-on: ubuntu-latest
    name: readable source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-readability.mjs

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - site
          - projects/feedback-copilot
          - projects/community-success-os
          - projects/edtech-ops-intelligence-os
    name: ${{ matrix.package }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      # A full install. --omit=optional was here to skip sharp (it exists only
      # for `npm run og`, and the generated PNGs are committed) — but rollup
      # ships its own platform binary as an optional dependency too, so the
      # flag took @rollup/rollup-linux-x64-gnu with it and every `npm test`
      # died before the first test ran. Installing sharp costs seconds; not
      # running the tests cost the whole point of this workflow.
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
